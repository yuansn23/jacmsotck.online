<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社交邀约策略生成器</title>
    <style>
        /* 保持原有的样式不变 */
    </style>
</head>
<body>
    <!-- 保持原有的HTML结构不变 -->
    
    <script>
        document.getElementById('generate-btn').addEventListener('click', async function() {
            // 获取输入值
            const stage = document.getElementById('stage').value;
            const interests = document.getElementById('interests').value.trim();
            const userStyle = document.getElementById('user_style').value;
            const scenario = document.getElementById('scenario').value;
            
            if (!interests) {
                alert('请输入对方的兴趣标签');
                return;
            }
            
            // 显示加载中，隐藏其他区域
            document.querySelector('.loading').style.display = 'block';
            document.querySelector('.error').style.display = 'none';
            document.getElementById('result-container').style.display = 'none';
            document.getElementById('generate-btn').disabled = true;
            
            try {
                // 构造符合API要求的messages数组
                const messages = [
                    {
                        "role": "system",
                        "content": "你是一位拥有10年经验的社交关系教练，擅长根据人际关系阶段和兴趣匹配度制定精准邀约策略。"
                    },
                    {
                        "role": "user",
                        "content": `请根据以下参数生成3种差异化邀约方案：
                        1. 关系阶段: ${stage}
                        2. 对方兴趣: ${interests}
                        3. 用户性格: ${userStyle}
                        4. 邀约场景: ${scenario}
                        
                        要求:
                        1. 生成保守型、适度型和积极型三种方案
                        2. 每种方案包含话术文本、策略解析、成功率评估和风险提示
                        3. 使用JSON格式返回，包含conservative、moderate、aggressive三个键
                        4. 保守型话术需包含第三方理由
                        5. 直接型话术可加入限时性
                        6. 避免直接使用'约会''喜欢'等敏感词`
                    }
                ];
                
                const apiKey = "sk-7ecf033dcf984fa7b23ab4593478b319";
                const apiUrl = "https://api.deepseek.com/chat/completions";
                
                // 使用CORS代理解决跨域问题
                const proxyUrl = "https://cors-anywhere.herokuapp.com/";
                const fullUrl = proxyUrl + apiUrl;
                
                const response = await fetch(fullUrl, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json",
                        "X-Requested-With": "XMLHttpRequest"
                    },
                    body: JSON.stringify({
                        "model": "deepseek-chat",
                        "messages": messages,
                        "temperature": 0.7,
                        "max_tokens": 2000,
                        "stream": false
                    })
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`API请求失败: ${response.status} - ${errorText}`);
                }
                
                const data = await response.json();
                console.log("API响应:", data);
                
                // 提取并处理返回内容
                const content = data.choices[0].message.content;
                let result;
                
                try {
                    // 尝试从Markdown代码块中提取JSON
                    const jsonMatch = content.match(/```json([\s\S]*?)```/);
                    if (jsonMatch) {
                        result = JSON.parse(jsonMatch[1].trim());
                    } else {
                        // 如果没有代码块，尝试直接解析
                        result = JSON.parse(content);
                    }
                } catch (e) {
                    console.error("解析JSON失败:", e);
                    throw new Error("API返回的数据格式不符合预期");
                }
                
                // 显示结果
                if (result) {
                    let strategiesHTML = '';
                    
                    // 检查是否包含所有必需的字段
                    const requiredFields = ['conservative', 'moderate', 'aggressive'];
                    if (requiredFields.every(field => field in result)) {
                        // 保守型策略
                        strategiesHTML += `
                            <div class="strategy-box">
                                <div class="strategy-title">保守型邀约 <span class="score">${result.conservative.score || 'N/A'}% 成功率</span></div>
                                <p><strong>话术:</strong> ${result.conservative.text || '无'}</p>
                                <p><strong>策略解析:</strong> ${result.conservative.logic || '无'}</p>
                                <p><strong>风险提示:</strong> ${result.conservative.risk || '无'}</p>
                            </div>
                        `;
                        
                        // 适度型策略
                        strategiesHTML += `
                            <div class="strategy-box">
                                <div class="strategy-title">适度型邀约 <span class="score">${result.moderate.score || 'N/A'}% 成功率</span></div>
                                <p><strong>话术:</strong> ${result.moderate.text || '无'}</p>
                                <p><strong>策略解析:</strong> ${result.moderate.logic || '无'}</p>
                                <p><strong>风险提示:</strong> ${result.moderate.risk || '无'}</p>
                            </div>
                        `;
                        
                        // 积极型策略
                        strategiesHTML += `
                            <div class="strategy-box">
                                <div class="strategy-title">积极型邀约 <span class="score">${result.aggressive.score || 'N/A'}% 成功率</span></div>
                                <p><strong>话术:</strong> ${result.aggressive.text || '无'}</p>
                                <p><strong>策略解析:</strong> ${result.aggressive.logic || '无'}</p>
                                <p><strong>风险提示:</strong> ${result.aggressive.risk || '无'}</p>
                            </div>
                        `;
                        
                        document.getElementById('strategies').innerHTML = strategiesHTML;
                        document.getElementById('interest-analysis').innerHTML = result.interest_analysis 
                            ? `<strong>兴趣分析:</strong> ${result.interest_analysis}` 
                            : '';
                    } else {
                        // 如果返回的数据不符合预期格式，直接显示原始内容
                        document.getElementById('strategies').innerHTML = `<pre>${content}</pre>`;
                    }
                    
                    document.getElementById('result-container').style.display = 'block';
                }
                
            } catch (error) {
                console.error('生成策略时出错:', error);
                document.querySelector('.error').innerHTML = `
                    <h3>生成策略时出错</h3>
                    <p>${error.message}</p>
                    <p>建议检查:</p>
                    <ul>
                        <li>网络连接是否正常</li>
                        <li>API密钥是否正确</li>
                        <li>输入参数是否合法</li>
                    </ul>
                    <p>详细错误信息请查看浏览器控制台(Console)</p>
                `;
                document.querySelector('.error').style.display = 'block';
            } finally {
                document.querySelector('.loading').style.display = 'none';
                document.getElementById('generate-btn').disabled = false;
            }
        });
    </script>
</body>
</html>
