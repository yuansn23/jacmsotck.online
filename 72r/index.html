<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>馬渕磨理子 LINE無料追加</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans JP', sans-serif;
        }
        
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .pulse-animation {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .shadow-custom {
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-purple-50 min-h-screen">
    <div class="container mx-auto px-4 py-6 max-w-md">
        <!-- Header Image -->
        <div class="text-center mb-6">
            <img src="img/8e99ad6644f57faaf15d4201b1a9403d.png" 
                 alt="馬渕磨理子" 
                 class="w-full rounded-lg shadow-custom">
        </div>
        
        <!-- Main Content -->
        <div class="bg-white rounded-2xl shadow-custom p-6 mb-6">
            <div class="text-center mb-6">
                <h1 class="text-xl font-black text-gray-800 leading-tight mb-4">
                    馬渕磨理子のLINEを無料で追加して<br>
                    <span class="text-3xl text-red-600">「7」</span>と送信するだけで、<br>
                    <span class="text-blue-600 font-black">明日上がる銘柄</span>がわかります！
                </h1>
                
                <p class="text-sm text-gray-700 leading-relaxed mb-4">
                    LINEを追加するだけで、無料で情報を受け取ることができ、毎週<span class="text-red-600 font-bold">60％の利益</span>を約束する優良株も手に入ります。
                </p>
                
                <div class="bg-yellow-100 border-l-4 border-yellow-500 p-4 mb-6">
                    <p class="text-lg font-bold text-gray-800">
                        今すぐ参加して、優良株をゲットしましょう！
                    </p>
                </div>
            </div>
            
            <!-- Action Button -->
            <div class="text-center mb-6">
                <button onclick="u8()" class="bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white text-lg font-bold py-4 px-8 rounded-full shadow-lg pulse-animation transform transition-all duration-200 hover:scale-105 whitespace-nowrap">
                    ラインで連絡してください
                </button>
            </div>
            
            <!-- Bottom Image -->
            <div class="text-center mb-4">
                <img src="img/a30124a9ca8c558c1f410c39b5a0185d.png" 
                     alt="株価情報" 
                     class="w-full rounded-lg">
            </div>
            
            <!-- Bottom Text -->
            <div class="bg-green-50 rounded-xl p-4 mb-4">
                <p class="text-center text-sm font-bold text-green-800 leading-relaxed">
                    LINEを追加して<span class="text-xl text-red-600">「7」</span>を送信すると、<br>
                    最新の株価上昇ニュースを<span class="text-blue-600">無料</span>で入手できる！
                </p>
            </div>
            
            <!-- Final CTA -->
            <div class="text-center">
                <button onclick="u8()" class="bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white text-lg font-bold py-4 px-8 rounded-full shadow-lg pulse-animation transform transition-all duration-200 hover:scale-105 whitespace-nowrap">
                    ラインで連絡してください
                </button>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="text-center text-xs text-gray-500">
            <p>※投資にはリスクが伴います。自己責任でご利用ください。</p>
        </div>
    </div>
    
    <script>
        function u8() {
            // 这里添加您的联系逻辑
           window.location.href="https://www.qq.com";
            // 例如：打开微信、跳转到联系页面等
        }
    </script>
</body>
</html>
