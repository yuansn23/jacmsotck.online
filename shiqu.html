<!DOCTYPE html>
<html>
<head>
    <title>时区检测演示</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        #timezone {
            font-size: 2em;
            padding: 20px;
            border: 2px solid #ccc;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="timezone">检测中...</div>

    <script>
        // 直接获取时区信息
        const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        document.getElementById('timezone').innerHTML = 
            `当前设备时区：<strong>${timezone}</strong>`;
    </script>
</body>
</html>
