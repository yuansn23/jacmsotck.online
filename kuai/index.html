<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资料领取</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#5D5CDE'
                    }
                }
            }
        }
    </script>
    <style>
        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.9; }
        }
        .breathe {
            animation: breathe 2s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-white dark:bg-gray-900 min-h-screen">
    <div class="container mx-auto px-4 py-6 max-w-md">
        <!-- 第一张图片 -->
        <div class="mb-6">
            <img src="img/to01.jpg" 
                 alt="宣传图1" 
                 class="w-full rounded-lg shadow-lg">
        </div>

        <!-- 第二张图片(GIF) -->
        <div class="mb-6">
            <img src="img/to02.gif" 
                 alt="动态图" 
                 class="w-full rounded-lg shadow-lg">
        </div>

        <!-- 领取资料按钮 -->
        <div class="mb-6 text-center">
            <button class="bg-primary hover:bg-purple-600 text-white font-bold py-4 px-8 rounded-full text-lg transition-all duration-300 transform hover:scale-105 shadow-lg w-full max-w-xs">
                点击即可领888 
            </button>
        </div>

        <!-- 第三张图片 -->
        <div class="mb-6">
            <img src="img/to03.jpg" 
                 alt="宣传图2" 
                 class="w-full rounded-lg shadow-lg">
        </div>

        <!-- 最后20点文案 -->
        <div class="mb-20 text-center">
            <div class="inline-block bg-red-500 hover:bg-red-600 text-white font-bold py-3 px-6 rounded-full text-lg cursor-pointer breathe transition-colors duration-300 shadow-lg">
                点击即可领888 
            </div>
        </div>
    </div>

    <!-- 底部悬浮按钮 -->
    <div class="fixed bottom-6 left-4 right-4 z-50">
        <button class="bg-primary hover:bg-purple-600 text-white font-bold py-3 px-8 rounded-full text-base flex items-center justify-center gap-2 shadow-2xl breathe transition-colors duration-300 w-full">
            <!-- QQ图标 -->
            <img src="img/qq.gif" alt="QQ" width="54" height="54" class="inline-block">
           彩票回血</br>
		  点击进入官网注册领取彩金
        </button>
    </div>

    <script>
        // 深色模式支持
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            if (event.matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });

        // 按钮点击事件
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function() {
			// 点击后跳转地址
			
               window.location.href="https://www.qq.com";
            });
        });
    </script>
</body>
</html>
