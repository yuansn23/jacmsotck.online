<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社交邀约助手</title>
    <style>
        :root {
            --primary: #07C160;
            --secondary: #F8F8F8;
            --border: #EEEEEE;
            --text-primary: #333333;
            --text-secondary: #666666;
            --card-bg: #FFFFFF;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background-color: var(--secondary);
            padding: 0;
            margin: 0;
        }
        .container {
            padding: 15px;
            max-width: 100%;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-top: 10px;
        }
        .header h1 {
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 500;
            margin: 0;
        }
        .form-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: var(--card-bg);
        }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: 500;
            margin-top: 5px;
        }
        .btn:disabled {
            opacity: 0.6;
        }
        .results {
            display: none;
        }
        .tabs {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-size: 14px;
            color: var(--text-secondary);
            position: relative;
        }
        .tab.active {
            color: var(--primary);
            font-weight: 500;
        }
        .tab.active:after {
            content: "";
            position: absolute;
            bottom: -1px;
            left: 25%;
            width: 50%;
            height: 2px;
            background-color: var(--primary);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .strategy-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .strategy-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .strategy-title {
            font-size: 16px;
            font-weight: 500;
            margin: 0;
        }
        .success-rate {
            font-size: 14px;
            color: var(--primary);
            font-weight: 500;
        }
        .strategy-content {
            margin-bottom: 15px;
        }
        .content-item {
            margin-bottom: 12px;
        }
        .content-item h4 {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0 0 5px 0;
        }
        .content-item p {
            font-size: 14px;
            margin: 0;
            line-height: 1.5;
        }
        .loading {
            text-align: center;
            padding: 20px 0;
        }
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(7, 193, 96, 0.2);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-message {
            color: #FA5151;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
            padding: 10px;
            background-color: rgba(250, 81, 81, 0.1);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>社交邀约助手</h1>
        </div>
        
        <div class="form-card">
            <div class="form-group">
                <label for="relationship">关系阶段</label>
                <select id="relationship" class="form-control">
                    <option value="刚认识">刚认识</option>
                    <option value="普通朋友" selected>普通朋友</option>
                    <option value="暧昧期">暧昧期</option>
                    <option value="亲密关系">亲密关系</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="interests">TA的兴趣爱好</label>
                <input type="text" id="interests" class="form-control" placeholder="例如：摄影、脱口秀、烘焙">
            </div>
            
            <div class="form-group">
                <label for="personality">你的性格</label>
                <select id="personality" class="form-control">
                    <option value="内向">内向</option>
                    <option value="外向" selected>外向</option>
                    <option value="幽默">幽默</option>
                    <option value="务实">务实</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="mbti">TA的MBTI类型</label>
                <input type="text" id="mbti" class="form-control" placeholder="例如：INTJ、ENFP等">
            </div>
            
            <div class="form-group">
                <label for="scenario">邀约场景</label>
                <select id="scenario" class="form-control">
                    <option value="周末约会">周末约会</option>
                    <option value="生日聚会">生日聚会</option>
                    <option value="旅行">旅行</option>
                    <option value="日常活动" selected>日常活动</option>
                </select>
            </div>
            
            <button id="generate-btn" class="btn">立即生成策略</button>
            <div id="error-message" class="error-message" style="display: none;"></div>
        </div>
        
        <div class="results" id="results">
            <div class="tabs">
                <div class="tab active" data-tab="conservative">保守型</div>
                <div class="tab" data-tab="moderate">适度型</div>
                <div class="tab" data-tab="aggressive">主动型</div>
            </div>
            
            <div class="tab-content active" id="conservative-tab">
                <div class="strategy-card">
                    <div class="strategy-header">
                        <h3 class="strategy-title">保守型策略</h3>
                        <div class="success-rate">成功率: <span id="conservative-score">0</span>%</div>
                    </div>
                    
                    <div class="strategy-content">
                        <div class="content-item">
                            <h4>邀约话术</h4>
                            <p id="conservative-text"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>策略逻辑</h4>
                            <p id="conservative-logic"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>潜在风险</h4>
                            <p id="conservative-risk"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>MBTI适配分析</h4>
                            <p id="conservative-mbti"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>心理学分析</h4>
                            <p id="conservative-psychology"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>行为预测</h4>
                            <p id="conservative-behavior"></p>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="tab-content" id="moderate-tab">
                <div class="strategy-card">
                    <div class="strategy-header">
                        <h3 class="strategy-title">适度型策略</h3>
                        <div class="success-rate">成功率: <span id="moderate-score">0</span>%</div>
                    </div>
                    
                    <div class="strategy-content">
                        <div class="content-item">
                            <h4>邀约话术</h4>
                            <p id="moderate-text"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>策略逻辑</h4>
                            <p id="moderate-logic"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>潜在风险</h4>
                            <p id="moderate-risk"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>MBTI适配分析</h4>
                            <p id="moderate-mbti"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>心理学分析</h4>
                            <p id="moderate-psychology"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>行为预测</h4>
                            <p id="moderate-behavior"></p>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="tab-content" id="aggressive-tab">
                <div class="strategy-card">
                    <div class="strategy-header">
                        <h3 class="strategy-title">主动型策略</h3>
                        <div class="success-rate">成功率: <span id="aggressive-score">0</span>%</div>
                    </div>
                    
                    <div class="strategy-content">
                        <div class="content-item">
                            <h4>邀约话术</h4>
                            <p id="aggressive-text"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>策略逻辑</h4>
                            <p id="aggressive-logic"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>潜在风险</h4>
                            <p id="aggressive-risk"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>MBTI适配分析</h4>
                            <p id="aggressive-mbti"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>心理学分析</h4>
                            <p id="aggressive-psychology"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>行为预测</h4>
                            <p id="aggressive-behavior"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('generate-btn').addEventListener('click', async function() {
            const btn = this;
            const errorElement = document.getElementById('error-message');
            
            // 获取表单值
            const relationship = document.getElementById('relationship').value;
            const interests = document.getElementById('interests').value.split(',').map(i => i.trim()).filter(i => i);
            const personality = document.getElementById('personality').value;
            const mbti = document.getElementById('mbti').value.trim();
            const scenario = document.getElementById('scenario').value;
            
            // 验证输入
            if (interests.length === 0) {
                errorElement.textContent = '请至少输入一个兴趣爱好';
                errorElement.style.display = 'block';
                return;
            }
            
            // 清空错误信息
            errorElement.style.display = 'none';
            
            // 禁用按钮并显示加载状态
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div> 生成中...';
            
            try {
                // 调用API获取策略
                const strategies = await generateStrategies(relationship, interests, personality, mbti, scenario);
                
                // 显示结果
                displayResults(strategies);
                
                // 显示结果区域
                document.getElementById('results').style.display = 'block';
            } catch (error) {
                console.error('生成失败:', error);
                errorElement.textContent = '生成失败，请稍后再试';
                errorElement.style.display = 'block';
            } finally {
                // 恢复按钮状态
                btn.disabled = false;
                btn.textContent = '立即生成策略';
            }
        });
        
        // 显示结果
        function displayResults(strategies) {
            // 保守型策略
            document.getElementById('conservative-text').textContent = strategies.conservative.text;
            document.getElementById('conservative-score').textContent = strategies.conservative.score;
            document.getElementById('conservative-logic').textContent = strategies.conservative.logic;
            document.getElementById('conservative-risk').textContent = strategies.conservative.risk;
            document.getElementById('conservative-mbti').textContent = strategies.conservative.mbti_analysis;
            document.getElementById('conservative-psychology').textContent = strategies.conservative.psychology_analysis;
            document.getElementById('conservative-behavior').textContent = strategies.conservative.behavior_analysis;
            
            // 适度型策略
            document.getElementById('moderate-text').textContent = strategies.moderate.text;
            document.getElementById('moderate-score').textContent = strategies.moderate.score;
            document.getElementById('moderate-logic').textContent = strategies.moderate.logic;
            document.getElementById('moderate-risk').textContent = strategies.moderate.risk;
            document.getElementById('moderate-mbti').textContent = strategies.moderate.mbti_analysis;
            document.getElementById('moderate-psychology').textContent = strategies.moderate.psychology_analysis;
            document.getElementById('moderate-behavior').textContent = strategies.moderate.behavior_analysis;
            
            // 主动型策略
            document.getElementById('aggressive-text').textContent = strategies.aggressive.text;
            document.getElementById('aggressive-score').textContent = strategies.aggressive.score;
            document.getElementById('aggressive-logic').textContent = strategies.aggressive.logic;
            document.getElementById('aggressive-risk').textContent = strategies.aggressive.risk;
            document.getElementById('aggressive-mbti').textContent = strategies.aggressive.mbti_analysis;
            document.getElementById('aggressive-psychology').textContent = strategies.aggressive.psychology_analysis;
            document.getElementById('aggressive-behavior').textContent = strategies.aggressive.behavior_analysis;
        }
        
        // 标签切换
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                // 移除所有标签和内容的active类
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                // 为点击的标签和对应内容添加active类
                this.classList.add('active');
                const tabId = this.getAttribute('data-tab') + '-tab';
                document.getElementById(tabId).classList.add('active');
            });
        });
        
        // 生成策略函数 - 直接返回结果不进行推理
        async function generateStrategies(relationship, interests, personality, mbti, scenario) {
            // 这里是模拟API返回的直接结果
            // 实际应用中应替换为真实的API调用
            
            // 模拟API延迟
            await new Promise(resolve => setTimeout(resolve, 800));
            
            // 根据MBTI类型生成详细分析
            const mbtiAnalysis = mbti ? generateMBTIAnalysis(mbti, relationship) : "未提供MBTI类型，基于通用性格分析";
            
            // 生成心理学分析
            const psychologyAnalysis = generatePsychologyAnalysis(relationship, interests);
            
            // 直接返回结果，不包含任何思考过程
            return {
                conservative: {
                    text: `听说最近有个${interests[0] || '不错'}的活动，朋友强烈推荐，要不要一起去看看？`,
                    score: Math.floor(Math.random() * 30) + 60,
                    logic: "使用第三方推荐降低邀约压力，适合关系初期建立信任",
                    risk: "可能显得过于谨慎。如果被拒绝，可以说'没关系，下次有机会再一起'保持轻松氛围",
                    mbti_analysis: mbtiAnalysis,
                    psychology_analysis: psychologyAnalysis,
                    behavior_analysis: "对方可能会礼貌性考虑邀约，需要后续跟进确认意向"
                },
                moderate: {
                    text: `我发现一个${interests[0] || '挺有意思'}的${scenario}活动，感觉你会喜欢，要一起参加吗？`,
                    score: Math.floor(Math.random() * 30) + 65,
                    logic: "直接表达邀约意图但留有选择空间，平衡主动与尊重",
                    risk: "可能被误解为普通邀约。可以补充'因为觉得你在这方面很有见解'增加诚意",
                    mbti_analysis: mbtiAnalysis,
                    psychology_analysis: psychologyAnalysis,
                    behavior_analysis: "对方会评估活动是否符合兴趣，可能要求了解更多细节"
                },
                aggressive: {
                    text: `这周六有个${interests[0] || '超棒'}的${scenario}活动，我已经订好票了，我们一起去吧！`,
                    score: Math.floor(Math.random() * 30) + 50,
                    logic: "展现自信和决断力，适合关系较亲密阶段",
                    risk: "可能显得强势。可以补充'如果你没空的话我也可以改期'给对方台阶",
                    mbti_analysis: mbtiAnalysis,
                    psychology_analysis: psychologyAnalysis,
                    behavior_analysis: "对方会直接表达是否接受，需要准备好应对拒绝的方案"
                }
            };
        }
        
        // 生成详细的MBTI分析
        function generateMBTIAnalysis(mbti, relationship) {
            const analysisMap = {
                "INTJ": `INTJ型人格(建筑师)偏好有计划的活动。建议提前告知活动细节，${relationship === "刚认识" ? "强调活动的学习价值" : "突出活动的独特性"}。`,
                "INTP": `INTP型人格(逻辑学家)喜欢智力挑战。邀约应${relationship === "刚认识" ? "保持一定距离感" : "展示你的知识储备"}，避免过于情绪化的表达。`,
                "ENTJ": `ENTJ型人格(指挥官)欣赏高效直接的沟通。可以${relationship === "亲密关系" ? "使用更亲密的语气" : "保持专业简洁"}，强调活动的目标导向。`,
                "ENTP": `ENTP型人格(辩论家)喜欢新鲜体验。${relationship === "暧昧期" ? "可以加入一些挑战性元素" : "突出活动的创新性"}，避免常规套路。`,
                "INFJ": `INFJ型人格(倡导者)重视深层连接。邀约应${relationship === "刚认识" ? "保持适度神秘感" : "表达真诚的欣赏"}，选择有意义的活动。`,
                "INFP": `INFP型人格(调停者)敏感于价值观契合。${relationship === "普通朋友" ? "强调活动的积极意义" : "表达个人感受"}，避免过于功利的目的。`,
                "ENFJ": `ENFJ型人格(主人公)喜欢社交互动。可以${relationship === "暧昧期" ? "加入一些浪漫元素" : "突出活动的社交属性"}，表达期待。`,
                "ENFP": `ENFP型人格(竞选者)热爱自由创意。${relationship === "亲密关系" ? "可以更随性一些" : "保持轻松愉快的氛围"}，避免太多限制。`,
                "ISTJ": `ISTJ型人格(物流师)偏好传统可靠。邀约应${relationship === "刚认识" ? "提前规划好所有细节" : "展示你的可靠性"}，避免临时变更。`,
                "ISFJ": `ISFJ型人格(守卫者)重视体贴关怀。${relationship === "普通朋友" ? "强调活动的舒适性" : "表达你的关心"}，选择熟悉的环境。`,
                "ESTJ": `ESTJ型人格(总经理)喜欢高效务实。可以${relationship === "暧昧期" ? "适当展示你的能力" : "直接说明活动价值"}，避免模糊表达。`,
                "ESFJ": `ESFJ型人格(执政官)享受和谐关系。邀约应${relationship === "刚认识" ? "保持适度正式" : "表达你的热情"}，强调共同体验。`,
                "ISTP": `ISTP型人格(鉴赏家)偏好实际行动。${relationship === "亲密关系" ? "可以更随性一些" : "突出活动的实践性"}，避免太多理论。`,
                "ISFP": `ISFP型人格(探险家)重视感官体验。可以${relationship === "普通朋友" ? "选择艺术或自然相关活动" : "表达对美的欣赏"}，保持轻松氛围。`,
                "ESTP": `ESTP型人格(企业家)喜欢刺激冒险。邀约应${relationship === "刚认识" ? "保持一定挑战性" : "展示你的活力"}，避免平淡安排。`,
                "ESFP": `ESFP型人格(表演者)热爱欢乐社交。${relationship === "暧昧期" ? "可以加入一些惊喜元素" : "突出活动的趣味性"}，保持正能量。`
            };
            
            return analysisMap[mbti.toUpperCase()] || `MBTI类型${mbti}的分析：基于该性格特点，建议邀约时${relationship === "刚认识" ? "保持适度距离" : "表达真诚态度"}，选择符合双方兴趣的活动。`;
        }
        
        // 生成详细的心理学分析
        function generatePsychologyAnalysis(relationship, interests) {
            const theories = [
                "根据社会交换理论，邀约应让对方感知到足够的回报价值",
                "相似吸引理论建议强调你们在" + interests[0] + "方面的共同兴趣",
                "自我表露理论表明，" + (relationship === "暧昧期" ? "适度的个人分享" : "共同经历") + "能增进亲密感",
                "认知失调理论提示，邀约方式应与对方对你的认知一致",
                "归因理论建议，将邀约动机归因于" + (interests.length > 1 ? "共同的兴趣爱好" : "自然的机会") + "而非个人意图"
            ];
            
            let analysis = theories.slice(0, 2).join("。") + "。";
            
            if (relationship === "刚认识") {
                analysis += "初次相识阶段，应运用单纯曝光效应，通过多次低强度互动建立熟悉感。";
            } else if (relationship === "暧昧期") {
                analysis += "暧昧期可运用吊桥效应，选择能引发适度紧张感的活动环境。";
            } else if (relationship === "亲密关系") {
                analysis += "亲密关系中，依恋理论提示应满足对方的情感需求和安全需求。";
            }
            
            analysis += "从行为心理学角度，" + interests.join("、") + "等兴趣表明对方可能偏好" + 
                (interests.some(i => ["摄影", "艺术"].includes(i)) ? "视觉刺激" : "实践体验") + "类活动。";
            
            return analysis;
        }
    </script>
</body>
</html>
