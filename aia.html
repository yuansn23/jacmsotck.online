<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社交邀约助手</title>
    <style>
        :root {
            --primary: #07C160;
            --secondary: #F8F8F8;
            --border: #EEEEEE;
            --text-primary: #333333;
            --text-secondary: #666666;
            --card-bg: #FFFFFF;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-primary);
            background-color: var(--secondary);
            padding: 0;
            margin: 0;
        }
        .container {
            padding: 15px;
            max-width: 100%;
            box-sizing: border-box;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding-top: 10px;
        }
        .header h1 {
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 500;
            margin: 0;
        }
        .form-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: var(--card-bg);
        }
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            font-weight: 500;
            margin-top: 5px;
        }
        .btn:disabled {
            opacity: 0.6;
        }
        .results {
            display: none;
        }
        .tabs {
            display: flex;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 10px 0;
            font-size: 14px;
            color: var(--text-secondary);
            position: relative;
        }
        .tab.active {
            color: var(--primary);
            font-weight: 500;
        }
        .tab.active:after {
            content: "";
            position: absolute;
            bottom: -1px;
            left: 25%;
            width: 50%;
            height: 2px;
            background-color: var(--primary);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .strategy-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .strategy-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .strategy-title {
            font-size: 16px;
            font-weight: 500;
            margin: 0;
        }
        .success-rate {
            font-size: 14px;
            color: var(--primary);
            font-weight: 500;
        }
        .strategy-content {
            margin-bottom: 15px;
        }
        .content-item {
            margin-bottom: 12px;
        }
        .content-item h4 {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0 0 5px 0;
        }
        .content-item p {
            font-size: 14px;
            margin: 0;
            line-height: 1.5;
        }
        .loading {
            text-align: center;
            padding: 20px 0;
        }
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(7, 193, 96, 0.2);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error-message {
            color: #FA5151;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
            padding: 10px;
            background-color: rgba(250, 81, 81, 0.1);
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>社交邀约助手</h1>
        </div>
        
        <div class="form-card">
            <div class="form-group">
                <label for="api-key">API密钥</label>
                <input type="password" id="api-key" class="form-control" placeholder="输入DeepSeek API密钥">
            </div>
            
            <div class="form-group">
                <label for="relationship">关系阶段</label>
                <select id="relationship" class="form-control">
                    <option value="刚认识">刚认识</option>
                    <option value="普通朋友" selected>普通朋友</option>
                    <option value="暧昧期">暧昧期</option>
                    <option value="亲密关系">亲密关系</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="interests">TA的兴趣爱好</label>
                <input type="text" id="interests" class="form-control" placeholder="例如：摄影、脱口秀、烘焙">
            </div>
            
            <div class="form-group">
                <label for="personality">你的性格</label>
                <select id="personality" class="form-control">
                    <option value="内向">内向</option>
                    <option value="外向" selected>外向</option>
                    <option value="幽默">幽默</option>
                    <option value="务实">务实</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="mbti">TA的MBTI类型</label>
                <input type="text" id="mbti" class="form-control" placeholder="例如：INTJ、ENFP等">
            </div>
            
            <div class="form-group">
                <label for="scenario">邀约场景</label>
                <select id="scenario" class="form-control">
                    <option value="周末约会">周末约会</option>
                    <option value="生日聚会">生日聚会</option>
                    <option value="旅行">旅行</option>
                    <option value="日常活动" selected>日常活动</option>
                </select>
            </div>
            
            <button id="generate-btn" class="btn">立即生成策略</button>
            <div id="error-message" class="error-message" style="display: none;"></div>
        </div>
        
        <div class="results" id="results">
            <div class="tabs">
                <div class="tab active" data-tab="conservative">保守型</div>
                <div class="tab" data-tab="moderate">适度型</div>
                <div class="tab" data-tab="aggressive">主动型</div>
            </div>
            
            <div class="tab-content active" id="conservative-tab">
                <div class="strategy-card">
                    <div class="strategy-header">
                        <h3 class="strategy-title">保守型策略</h3>
                        <div class="success-rate">成功率: <span id="conservative-score">0</span>%</div>
                    </div>
                    
                    <div class="strategy-content">
                        <div class="content-item">
                            <h4>邀约话术</h4>
                            <p id="conservative-text"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>策略逻辑</h4>
                            <p id="conservative-logic"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>潜在风险</h4>
                            <p id="conservative-risk"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>MBTI适配分析</h4>
                            <p id="conservative-mbti"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>心理学分析</h4>
                            <p id="conservative-psychology"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>行为预测</h4>
                            <p id="conservative-behavior"></p>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="tab-content" id="moderate-tab">
                <div class="strategy-card">
                    <div class="strategy-header">
                        <h3 class="strategy-title">适度型策略</h3>
                        <div class="success-rate">成功率: <span id="moderate-score">0</span>%</div>
                    </div>
                    
                    <div class="strategy-content">
                        <div class="content-item">
                            <h4>邀约话术</h4>
                            <p id="moderate-text"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>策略逻辑</h4>
                            <p id="moderate-logic"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>潜在风险</h4>
                            <p id="moderate-risk"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>MBTI适配分析</h4>
                            <p id="moderate-mbti"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>心理学分析</h4>
                            <p id="moderate-psychology"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>行为预测</h4>
                            <p id="moderate-behavior"></p>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="tab-content" id="aggressive-tab">
                <div class="strategy-card">
                    <div class="strategy-header">
                        <h3 class="strategy-title">主动型策略</h3>
                        <div class="success-rate">成功率: <span id="aggressive-score">0</span>%</div>
                    </div>
                    
                    <div class="strategy-content">
                        <div class="content-item">
                            <h4>邀约话术</h4>
                            <p id="aggressive-text"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>策略逻辑</h4>
                            <p id="aggressive-logic"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>潜在风险</h4>
                            <p id="aggressive-risk"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>MBTI适配分析</h4>
                            <p id="aggressive-mbti"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>心理学分析</h4>
                            <p id="aggressive-psychology"></p>
                        </div>
                        
                        <div class="content-item">
                            <h4>行为预测</h4>
                            <p id="aggressive-behavior"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('generate-btn').addEventListener('click', async function() {
            const btn = this;
            const errorElement = document.getElementById('error-message');
            
            // 获取表单值
            const apiKey = document.getElementById('api-key').value.trim();
            const relationship = document.getElementById('relationship').value;
            const interests = document.getElementById('interests').value.split(',').map(i => i.trim()).filter(i => i);
            const personality = document.getElementById('personality').value;
            const mbti = document.getElementById('mbti').value.trim();
            const scenario = document.getElementById('scenario').value;
            
            // 验证输入
            if (!apiKey) {
                errorElement.textContent = '请输入API密钥';
                errorElement.style.display = 'block';
                return;
            }
            
            if (interests.length === 0) {
                errorElement.textContent = '请至少输入一个兴趣爱好';
                errorElement.style.display = 'block';
                return;
            }
            
            // 清空错误信息
            errorElement.style.display = 'none';
            
            // 禁用按钮并显示加载状态
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div> 生成中...';
            
            try {
                // 直接调用API获取策略
                const strategies = await callDeepSeekAPI(apiKey, relationship, interests, personality, mbti, scenario);
                
                // 显示结果
                displayResults(strategies);
                
                // 显示结果区域
                document.getElementById('results').style.display = 'block';
            } catch (error) {
                console.error('API调用失败:', error);
                errorElement.textContent = 'API调用失败: ' + error.message;
                errorElement.style.display = 'block';
            } finally {
                // 恢复按钮状态
                btn.disabled = false;
                btn.textContent = '立即生成策略';
            }
        });
        
        // 显示结果
        function displayResults(strategies) {
            // 保守型策略
            document.getElementById('conservative-text').textContent = strategies.conservative.text;
            document.getElementById('conservative-score').textContent = strategies.conservative.score;
            document.getElementById('conservative-logic').textContent = strategies.conservative.logic;
            document.getElementById('conservative-risk').textContent = strategies.conservative.risk;
            document.getElementById('conservative-mbti').textContent = strategies.conservative.mbti_analysis;
            document.getElementById('conservative-psychology').textContent = strategies.conservative.psychology_analysis;
            document.getElementById('conservative-behavior').textContent = strategies.conservative.behavior_analysis;
            
            // 适度型策略
            document.getElementById('moderate-text').textContent = strategies.moderate.text;
            document.getElementById('moderate-score').textContent = strategies.moderate.score;
            document.getElementById('moderate-logic').textContent = strategies.moderate.logic;
            document.getElementById('moderate-risk').textContent = strategies.moderate.risk;
            document.getElementById('moderate-mbti').textContent = strategies.moderate.mbti_analysis;
            document.getElementById('moderate-psychology').textContent = strategies.moderate.psychology_analysis;
            document.getElementById('moderate-behavior').textContent = strategies.moderate.behavior_analysis;
            
            // 主动型策略
            document.getElementById('aggressive-text').textContent = strategies.aggressive.text;
            document.getElementById('aggressive-score').textContent = strategies.aggressive.score;
            document.getElementById('aggressive-logic').textContent = strategies.aggressive.logic;
            document.getElementById('aggressive-risk').textContent = strategies.aggressive.risk;
            document.getElementById('aggressive-mbti').textContent = strategies.aggressive.mbti_analysis;
            document.getElementById('aggressive-psychology').textContent = strategies.aggressive.psychology_analysis;
            document.getElementById('aggressive-behavior').textContent = strategies.aggressive.behavior_analysis;
        }
        
        // 标签切换
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', function() {
                // 移除所有标签和内容的active类
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                // 为点击的标签和对应内容添加active类
                this.classList.add('active');
                const tabId = this.getAttribute('data-tab') + '-tab';
                document.getElementById(tabId).classList.add('active');
            });
        });
        
        // 直接调用DeepSeek API的函数 - 不进行任何推理，直接返回结果
        async function callDeepSeekAPI(apiKey, relationship, interests, personality, mbti, scenario) {
            // 构造极简prompt - 直接要求答案
            const prompt = `直接生成邀约策略JSON，不要任何解释：
{
  "relationship": "${relationship}",
  "interests": "${interests.join(',')}",
  "personality": "${personality}",
  "mbti": "${mbti}",
  "scenario": "${scenario}"
}`;

            // 实际API调用 - 设置最快响应参数
            const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: "deepseek-chat",
                    messages: [
                        {
                            role: "user",
                            content: prompt
                        }
                    ],
                    temperature: 1.0,  // 最高随机性
                    max_tokens: 1000,
                    response_format: { type: "json_object" },
                    stream: false
                })
            });
            
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || `HTTP错误: ${response.status}`);
            }
            
            const data = await response.json();
            
            // 直接解析API返回的JSON内容
            try {
                return JSON.parse(data.choices[0].message.content);
            } catch (e) {
                console.error('JSON解析错误:', e);
                throw new Error('无效的API响应格式');
            }
        }
    </script>
</body>
</html>
